name: Build Unsigned Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-unsigned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # app/build.gradle.kts has no signingConfig on the release build type,
      # so this produces a genuinely UNSIGNED apk (app-release-unsigned.apk),
      # not a debug-signed one.
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      # Downloadable from the run's "Artifacts" section, no tag/release needed.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error

      # Only runs when triggered by pushing a tag like v1.0.0; attaches the
      # same APK to a GitHub Release for a permanent download link.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.apk_path }}
          generate_release_notes: true
          name: ${{ github.ref_name }} (unsigned)
          body: |
            ⚠️ This APK is **unsigned**. You must sign it yourself (e.g. with
            `apksigner` and a debug/release key) before it will install.
